# ═══════════════════════════════════════════════════════════════════
#  青冥仓库 · 自定义界面（语法与龙核 DragonCore 的 Gui 完全一致）
#  ───────────────────────────────────────────────────────────────────
#  放在 plugins/QingMingVault/gui/ 下，改完 /vault reload 生效。
#  多个模板时，写 main: true 的那个当主界面。
#
#  ── 关于坐标（重要）──
#  所有组件的 x 都写成  (w-660)/2+数字，y 写成 (h-470)/2+数字。
#  w / h 是屏幕（GUI 缩放后）的宽高，减掉界面尺寸再除以 2 = 居中。
#  想整体挪动：只改 (w-660) / (h-470) 这两个数字，别去动后面的偏移量。
#
#  ── 插件认的组件名（名字必须这么起）──
#  格1 … 格27        texture，仓库格子外框 + 点击层（左中右键都挂这里）
#  物1 … 物27        slot，仓库物品图标（identifier 由插件改写）
#  数1 … 数27        label，这一格存了多少
#  背包格1 … 背包格36  texture，玩家背包的点击层
#  背包物1 … 背包物36  slot，玩家背包里的物品（插件每帧同步真实背包）
#  页码              当前页 / 总页
#  上一页 / 下一页    翻页，没页可翻时自动隐藏
#  种类 / 总数        仓库统计
#  空                仓库为空时显示的提示
#  关闭              点了关界面
#  取数量xxx         「自定义数量」浮层，没在调数量时整组隐藏
#
#  ★ 格子顺序：物 → 格 → 数
#    客户端点击只会发给「最上面那个」组件，所以点击层必须盖在物品槽上面；
#    而格子贴图中心是透明的，物品不会变暗，鼠标移上去也仍然是物品原生 tooltip。
#
#  ── 可用变量 ──
#  {w} {h} {page} {pages} {kinds} {total} {cols} {rows} {per} {qty} {name}
#  仓库格子另有 {index}（物品序号，0 起）/ {cell}；背包格子另有 {inv}（真实背包索引）
#
#  ── 按钮怎么调插件 ──
#  方法.发包('QingMingVault', '动作', 参数…)
#    取 '1' '{index}'     取出 1 个（左键）
#    取 '64' '{index}'    取出 64 个（中键）
#    全部 '{index}'       这一类全取出来
#    自定 '{index}'       右键：弹出数量浮层
#    调量 '1' / '-1'      浮层里加减数量
#    确定 / 收起          浮层确认 / 关闭
#    存 '{inv}' '1'       把背包这一格整组存进去
#    存 '{inv}' 方法.键位是否按下('LSHIFT')   按住 Shift 存整组，否则存 1 个
#    翻页 '1' / '-1'
#    关闭
# ═══════════════════════════════════════════════════════════════════

main: true
size: [660, 470]
cols: 9
rows: 3
# ★ through: true —— 「鼠标事件穿透」。
#   默认 false 时，鼠标只认最上面那一个组件：格子贴图（点击层）盖住了物品槽，
#   客户端就不给物品槽显示原生 tooltip，只会画贴图自己的 tip（名字是英文的）。
#   开了它以后：悬浮 → 客户端会挑「最后一个物品槽」，画的是物品自己的原生提示
#   （中文名 / 附魔 / 属性全都对）；点击 → 所有叠在一起的组件都响应，
#   所以贴图上的左中右键照样能用。
through: true


